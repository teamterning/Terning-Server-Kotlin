name: DOCKER-CD-STAGING

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      working-directory: .

    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: application.yml 생성
        run: |
          mkdir -p ./src/main/resources && cd $_
          touch ./application.yml
          echo "${{ secrets.YML }}" > ./application.yml
        working-directory: ${{ env.working-directory }}

      - name: application-staging.yml 생성
        run: |
          cd ./src/main/resources
          touch ./application-staging.yml
          echo "${{ secrets.PROD_STAGING }}" > ./application-staging.yml
        working-directory: ${{ env.working-directory }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.STAGING_DOCKER_LOGIN_USERNAME }}
          password: ${{ secrets.STAGING_DOCKER_LOGIN_ACCESSTOKEN }}

      - name: Docker Image Build and Push (Native)
        run: |
          docker build -f Dockerfile-native-staging \
            -t ${{ secrets.STAGING_DOCKER_LOGIN_USERNAME }}/terning_kotlin:latest \
            -t ${{ secrets.STAGING_DOCKER_LOGIN_USERNAME }}/terning_kotlin:${{ github.sha }} .
          
          docker push ${{ secrets.STAGING_DOCKER_LOGIN_USERNAME }}/terning_kotlin --all-tags
        working-directory: ${{ env.working-directory }}

  cd:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_KEY }}
          script: |
            cd ~
            ./deploy-staging.sh ${{ github.sha }}
